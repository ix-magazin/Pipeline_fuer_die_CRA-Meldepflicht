apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: require-signed-images
spec:
  validationActions:
    - Deny
  autogen:
    podControllers:
      controllers:
        - deployments
        - statefulsets
        - jobs
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  matchImageReferences:
    - glob: "harbor.beispielshop.example/shop/*"
  attestors:
    - name: ci
      cosign:
        keyless:
          identities:
            - issuer: "https://token.actions.githubusercontent.com"
              subject: "https://github.com/beispielshop/shop/.github/workflows/release.yml@refs/heads/main"
  validations:
    - expression: >-
        images.containers.map(i,
          verifyImageSignatures(i, [attestors.ci])).all(s, s > 0)
